name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 解压并校验版本
        id: loc
        run: |
          ZIP_FILE="plane-game.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::找不到 $ZIP_FILE"
            exit 1
          fi
          echo "使用压缩包: $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d _proj
          S=$(find _proj -name 'settings.gradle*' | head -1)
          DIR=$(dirname "$S")
          echo "========== 正在校验版本信息 =========="
          grep -E "versionCode|versionName" "$DIR/app/build.gradle" || true
          echo "======================================"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: 构建 APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.loc.outputs.dir }}/**/build/outputs/apk/debug/*.apk
